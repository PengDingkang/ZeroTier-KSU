name: Release Module

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create, e.g. v1.0.0
        required: false
        type: string
      release_name:
        description: Release title override
        required: false
        type: string
      prerelease:
        description: Mark release as prerelease
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git make file shellcheck zip unzip python3 g++-aarch64-linux-gnu

      - name: Read module metadata
        id: meta
        shell: bash
        run: |
          module_version="$(sed -n 's/^version=//p' module.prop)"
          core_version="$(tr -d '\r\n' < CORE_VERSION)"
          tag_name="${{ github.event.inputs.tag_name }}"
          release_name="${{ github.event.inputs.release_name }}"
          if [ -z "$tag_name" ]; then
            tag_name="$module_version"
          fi
          if [ -z "$release_name" ]; then
            release_name="ZeroTier KSU ${module_version} (core ${core_version})"
          fi
          package_name="ZeroTier-KSU-${module_version}-core-${core_version}.zip"
          echo "module_version=${module_version}" >> "$GITHUB_OUTPUT"
          echo "core_version=${core_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"

      - name: Validate and test
        shell: bash
        run: sh scripts/ci/validate.sh

      - name: Compute core cache key
        id: core-cache
        run: |
          core_key=$(sh scripts/ci/build-core.sh --cache-key)
          echo "key=$core_key" >> "$GITHUB_OUTPUT"

      - name: Cache compiled core
        uses: actions/cache@v6
        with:
          path: .cache/core
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.core-cache.outputs.key }}

      - name: Build zerotier-one for aarch64
        run: sh scripts/ci/build-core.sh

      - name: Create release package
        shell: bash
        run: |
          mkdir -p dist
          zip -qr "dist/${{ steps.meta.outputs.package_name }}" \
            META-INF \
            webroot \
            boot-completed.sh \
            customize.sh \
            zerotier \
            zerotier-one \
            module.prop \
            uninstall.sh

      - name: Generate release notes from changelog
        shell: bash
        run: |
          version="${{ steps.meta.outputs.module_version }}"
          awk -v version="$version" '
            /^# / {
              if (in_section) exit
              if (index($0, version) > 0) {
                in_section = 1
                found = 1
                next
              }
            }
            in_section { print }
            END {
              if (!found) exit 1
            }
          ' changelog.md > dist/release_notes.md
          sed -i -e '/./,$!d' dist/release_notes.md
          if [ ! -s dist/release_notes.md ]; then
            echo "No changelog content found for ${version}"
            exit 1
          fi

      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/${{ steps.meta.outputs.package_name }}
          fail_on_unmatched_files: true
          body_path: dist/release_notes.md
          generate_release_notes: true

      - name: Verify public ZIP and prepare update metadata
        if: ${{ !inputs.prerelease }}
        env:
          RELEASE_ASSETS: ${{ steps.release.outputs.assets }}
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag_name }}
        run: |
          python3 scripts/ci/prepare-update.py \
            --package "dist/$PACKAGE_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --output dist/update.json

      - name: Checkout current update branch
        if: ${{ !inputs.prerelease }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .update-metadata

      - name: Publish stable update metadata
        if: ${{ !inputs.prerelease }}
        env:
          UPDATE_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag_name }}
        run: |
          sh scripts/ci/publish-update.sh \
            "$GITHUB_WORKSPACE/dist/update.json" \
            "$GITHUB_WORKSPACE/.update-metadata" \
            "$UPDATE_BRANCH" "$RELEASE_TAG"
