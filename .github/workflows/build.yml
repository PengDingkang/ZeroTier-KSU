name: Build Module

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git make file shellcheck zip unzip python3 g++-aarch64-linux-gnu

      - name: Read module metadata
        id: meta
        shell: bash
        run: |
          module_version="$(sed -n 's/^version=//p' module.prop)"
          core_version="$(tr -d '\r\n' < CORE_VERSION)"
          package_name="ZeroTier-KSU-${module_version}-core-${core_version}.zip"
          echo "module_version=${module_version}" >> "$GITHUB_OUTPUT"
          echo "core_version=${core_version}" >> "$GITHUB_OUTPUT"
          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"

      - name: Validate and test
        shell: bash
        run: sh scripts/ci/validate.sh

      - name: Compute core cache key
        id: core-cache
        run: |
          core_key=$(sh scripts/ci/build-core.sh --cache-key)
          echo "key=$core_key" >> "$GITHUB_OUTPUT"

      - name: Cache compiled core
        uses: actions/cache@v6
        with:
          path: .cache/core
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.core-cache.outputs.key }}

      - name: Build zerotier-one for aarch64
        run: sh scripts/ci/build-core.sh

      - name: Create module package
        shell: bash
        run: |
          mkdir -p dist
          zip -qr "dist/${{ steps.meta.outputs.package_name }}" \
            META-INF \
            webroot \
            boot-completed.sh \
            customize.sh \
            zerotier \
            zerotier-one \
            module.prop \
            uninstall.sh

      - name: Verify package contents
        shell: bash
        run: |
          package="dist/${{ steps.meta.outputs.package_name }}"
          unzip -Z -1 "$package" | tee package-list.txt

          required_paths=(
            "META-INF/"
            "META-INF/com/"
            "META-INF/com/google/"
            "META-INF/com/google/android/"
            "META-INF/com/google/android/update-binary"
            "META-INF/com/google/android/updater-script"
            "webroot/"
            "webroot/index.html"
            "boot-completed.sh"
            "customize.sh"
            "zerotier"
            "zerotier-one"
            "module.prop"
            "uninstall.sh"
          )

          forbidden_patterns=(
            "^scripts/"
            "^tests/"
            "^\\.cache/"
            "^tmp/"
            "^dist/"
            "^\\.git/"
            "^\\.github/"
            "^\\.gitattributes$"
            "^\\.gitignore$"
            "^README\\.md$"
            "^LICENSE$"
          )

          for path in "${required_paths[@]}"; do
            if ! grep -Fxq "$path" package-list.txt; then
              echo "Missing required path in package: $path"
              exit 1
            fi
          done

          for pattern in "${forbidden_patterns[@]}"; do
            if grep -Eq "$pattern" package-list.txt; then
              echo "Forbidden path matched in package: $pattern"
              exit 1
            fi
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.package_name }}
          path: dist/${{ steps.meta.outputs.package_name }}
          if-no-files-found: error
